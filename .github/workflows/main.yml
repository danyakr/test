name: tests
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-python@v5.2.0
      - name: test
        run: |
          echo test
          python -c "print('Hello, World!')"
          pip install pytest-playwright
          playwright install
          python pytest
        
